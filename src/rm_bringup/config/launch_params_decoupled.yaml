# ========================================
# 解耦架构集成测试启动参数配置
# ========================================

# --------- 通用参数 ---------
# 机器人配置标签，用于选择 rm_bringup/config/<robot>/ 下的真实参数
robot: 'hero'

# 命名空间 所有节点、话题都会以这个命名空间开头
namespace: ''

# image_source: (video | mindvision | hik)
image_source: 'hik'

# true: 虚拟下位机 false: 实车
virtual_serial: false

# true: 开启调试模式 (发布可视化markers)
debug: true

# tracker_impl: (cpp | python)
# cpp:    使用 C++ 组件节点 (rclcpp_components)
# python: 使用 Python 独立节点
tracker_impl: 'cpp'

# --------- 相机/URDF参数 ---------
# 舵轮 6mm 相机相对于里程计的位姿 (相机安装位置)
# odom2camera:
#   xyz: "\"0.151 0.00  0.040\""
#   rpy: "\"0.0  0.02  0.0100\""

# # 英雄
odom2camera:
  xyz: "\"0.174275 0.000 0.086463 \""
  rpy: "\"0.0  0.1396  -0.00\""

# # 哨兵
# odom2camera:
#   xyz: "\"0.174275 0.000 0.086463 \""
#   rpy: "\"0.0  0.1396  -0.00\""

# --------- 节点启动延迟 (秒) ---------
# 用于控制节点启动顺序，确保依赖关系正确
delays:
  serial: 1.5
  camera_detector: 2.0
  ballistic_solver: 2.0
  armor_tracker: 2.5
  robot_pose_estimator: 3.0
  target_selector: 3.5
  trajectory_planner: 4.0

# --------- 解耦架构数据流 ---------
# armor_detector/armors
#       ↓
# armor_tracker/tracked_armors
#       ↓
# robot_pose_estimator/robots + robot_pose_estimator/virtual_armors
#       ↓
# target_selector/selected_target
#       ↓
# trajectory_planner/gimbal_cmd
#       ↑
# ballistic_solver (服务)
