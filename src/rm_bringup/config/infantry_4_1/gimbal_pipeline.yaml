gimbal_pipeline:
  ros__parameters:
    binder:
      enable_soft_fusion: true
      soft_fusion_w_topology: 0.05
    controller:
      bullet_speed: 22.5
      delay:
        control_latency_s: 0.0
        prediction_extra_s: 0.0
        trigger_to_muzzle_s: 0.13
      fire:
        facing_filter_opening_angle_deg: 60.0
        probability:
          ballistic_growth_x: 0.0003
          ballistic_growth_y: 0.0006
          ballistic_growth_z: 0.0008
          ballistic_sigma_x0: 0.001
          ballistic_sigma_y0: 0.0015
          ballistic_sigma_z0: 0.0015
          burst:
            burst_bullet_count: 1
          commit:
            min_fire_ms: 20.0
          enable: true
          evidence:
            log_clip: 5.0
            reference_probability_p0: 0.45
            window_ms: 10.0
          future_step_ms: 5.0
          future_window_ms: 500.0
          gate:
            alpha: 0.85
            fire_off_th: 0.35
            fire_on_th: 0.45
            strategy: legacy
          normal_velocity_gate:
            front_epsilon: 1e-4
            max_complement_angle_deg: 35.0
          normal_velocity_weight:
            enable: true
            v_ref: 10.0
          sigma_point:
            sigma_v0: 0.3
          temperature:
            theta_reset_cold: 0.0
            theta_reset_hot: 0.0
            value: 0.1
          use_tracker_covariance: false
          window_fusion: max
        use_gimbal_kinematics: false
        visualization:
          image_debug:
            enable: false
      mpc:
        N: 5
        allow_muzzle_compensation: true
        diagnostics:
          enable: true
        dt: 0.05
        max_accel: 30.0
        q_pitch: 100.0
        q_pitch_vel: 1.0
        q_yaw: 1000.0
        q_yaw_vel: 1.0
        r_pitch: 0.001
        r_yaw: 0.001
        s_pitch: 0.01
        s_yaw: 0.01
        vel_clamp:
          max_linear_speed: 1.0
          max_v_yaw: 10.0
        weighting:
          enable: true
      output_filter:
        enable_clamping: true
        enable_outlier_rejection: true
        enable_rate_limiter: true
        max_pitch_diff: 10.0
        max_pitch_rate: 3.0
        outlier_threshold_pitch: 5.0
      solver:
        facing_enter_angle: 25.0
        facing_exit_angle: 35.0
        selection_method: facing_or_virtual_pose
        shooting_range_height: 0.1
        shooting_range_width: 0.1
        side_angle: 25.0
        virtual_pose:
          auto_switch:
            enable: false
            enter_vyaw: 8.0
            exit_vyaw: 6.0
            selection_method: virtual_pose
    default_dza: 0.02
    logging:
      enable: true
    motion:
      ca_process_noise_acc: 0.1
      cv_process_noise_vel: 1.2
      singer_alpha: 5.5
      singer_sigma: 1.5
    norm4_v3:
      backend_config:
        backend_type: inekf
        noise_profile: package://gimbal_pipeline/config/norm4_v3/profiles/noise/ypd_ba_low_weight.yaml
      debug_log:
        enable: true
        throttle_ms: 300
        verbose: true
      hypothesis_selector:
        evidence_prior_enable: true
        min_top1_confidence: 0.45
      inekf:
        single_update:
          structural_gain_dza: 0.01
          structural_gain_r: 0.01
      inekf_runtime:
        motion_profile: package://gimbal_pipeline/config/norm4_v3/profiles/motion/default.yaml
        noise_profile: package://gimbal_pipeline/config/norm4_v3/profiles/noise/default.yaml
        translation_model: ''
      slow_structure:
        alpha_dza_dual: 1.0
        alpha_dza_single: 1.0
        alpha_r1_dual: 1.0
        alpha_r1_single: 1.0
        alpha_r2_dual: 1.0
        alpha_r2_single: 1.0
        prior_pull_gain: 0.0002
        prior_sigma_dza: 0.9
        prior_sigma_r: 0.9
        q_theta_dza: 5.0
        q_theta_r1: 10.0
        q_theta_r2: 10.0
      warmup:
        min_confidence_to_commit: 0.1
        min_margin_to_commit: 0.5
    outpost:
      binding_enable_multi_obs: false
      lost_thres: 50
      max_match_distance: 5.0
      max_match_yaw_diff: 3.0
      singer_alpha: 0.0
      singer_sigma: 0.0
      spin_process_noise_theta_acc: 1.0
      spin_process_noise_theta_rate: 1.0
      temp_lost_thres: 5
      weight_z_history: 3.0
    panel_mismatch:
      threshold_t1: 0.0009
    predict_rate: 100.0
    selector:
      priority_robot_ids:
      - '1'
      - '3'
      - '4'
      - '5'
      - '2'
      - sentry
      - outpost
      - base
    smoother:
      enable_outlier_filter: false
      enable_position_smooth: true
      vel_beta: 0.01
      vel_min_cutoff: 0.1
    spin:
      spin_process_noise_delta_acc: 45.0
      spin_process_noise_delta_rate: 3.5
      spin_process_noise_yaw_acc: 10.0
      spin_process_noise_yaw_rate: 10.5
    tracker:
      degraded_single_obs_enable: false
      jump_binding_enable: false
      lost_thres: 15
      max_match_distance: 2.0
      max_match_yaw_diff: 1.0
    tracker_timeout: 1.5
    ukf:
      dual_obs_noise_pos: 0.01
      enable_ypd_observation_noise: true
      obs_noise_pos: 0.03
      obs_noise_yaw: 0.03
