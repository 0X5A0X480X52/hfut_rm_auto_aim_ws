/**:
  ros__parameters:
    debug: true
    target_frame: odom
    detect_color: 1
    binary_thres: 60

    use_pca: true # 使用PCA算法矫正灯条的角点
    use_ba: true # 使用BA优化算法求解装甲板的Yaw角 

    light.min_ratio: 0.01
    light.max_ratio: 1.0
    light.max_angle: 40.0
    light.color_diff_thresh: 20
    armor.min_light_ratio: 0.8
    armor.min_small_center_distance: 0.8
    armor.max_small_center_distance: 3.5
    armor.min_large_center_distance: 3.5
    armor.max_large_center_distance: 8.0
    armor.max_angle: 35.0

    classifier_threshold: 0.6
    ignore_classes: ["negative"]

    armor_detector.binary_img.enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
    armor_detector.number_img.enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]
    armor_detector.result_img.enable_pub_plugins: ["image_transport/raw", "image_transport/compressed"]

