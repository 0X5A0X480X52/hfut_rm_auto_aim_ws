gimbal_pipeline:
  ros__parameters:
    binder:
      enable_soft_fusion: false
      soft_fusion_w_topology: 0.15
    controller:
      bullet_speed: 11.5
      delay:
        control_latency_s: 0.0
        prediction_extra_s: 0.0
        trigger_to_muzzle_s: 0.1
      fire:
        facing_filter_opening_angle_deg: 85.0
        probability:
          ballistic_growth_x: 0.03
          ballistic_growth_y: 0.06
          ballistic_growth_z: 0.08
          ballistic_sigma_x0: 0.01
          ballistic_sigma_y0: 0.015
          ballistic_sigma_z0: 0.015
          burst:
            burst_bullet_count: 5
          commit:
            min_fire_ms: 20.0
          enable: false
          evidence:
            log_clip: 2.0
            reference_probability_p0: 0.6
            window_ms: 50.0
          future_step_ms: 10.0
          future_window_ms: 50.0
          gate:
            alpha: 0.85
            fire_off_th: 0.35
            fire_on_th: 0.65
            strategy: legacy
          normal_velocity_gate:
            front_epsilon: 1e-4
            max_complement_angle_deg: 90.0
          normal_velocity_weight:
            enable: false
            v_ref: 28.0
          sigma_point:
            sigma_v0: 0.3
          temperature:
            theta_reset_cold: 0.0
            theta_reset_hot: 0.0
            value: 0.5
          use_tracker_covariance: true
          window_fusion: max
        use_gimbal_kinematics: true
        visualization:
          image_debug:
            enable: false
      mpc:
        N: 50
        diagnostics:
          enable: false
        dt: 0.05
        max_accel: 30.0
        q_pitch: 100.0
        q_pitch_vel: 1.0
        q_yaw: 100.0
        q_yaw_vel: 1.0
        r_pitch: 0.001
        r_yaw: 0.001
        s_pitch: 0.001
        s_yaw: 0.001
        vel_clamp:
          max_linear_speed: 1.0
          max_v_yaw: 10.0
        weighting:
          enable: false
      output_filter:
        enable_clamping: false
        enable_outlier_rejection: false
        enable_rate_limiter: false
        max_pitch_diff: 10.0
        max_pitch_rate: 3.0
        outlier_threshold_pitch: 5.0
      solver:
        facing_enter_angle: 5.0
        facing_exit_angle: 10.0
        selection_method: min_movement_with_facing
        shooting_range_height: 0.135
        shooting_range_width: 0.135
        side_angle: 15.0
        virtual_pose:
          auto_switch:
            enable: true
            enter_vyaw: 1.0
            exit_vyaw: 16.0
            selection_method: virtual_fixed_id
    default_dza: 0.0
    logging:
      enable: false
    motion:
      ca_process_noise_acc: 0.1
      cv_process_noise_vel: 1.2
      singer_alpha: 1.5
      singer_sigma: 0.3
    norm4_v3:
      backend_config:
        backend_type: ukf_v1
        noise_profile: package://gimbal_pipeline/config/norm4_v3/profiles/noise/default.yaml
      hypothesis_selector:
        evidence_prior_enable: false
        min_top1_confidence: 0.55
      inekf:
        single_update:
          structural_gain_dza: 0.0
          structural_gain_r: 0.0
      inekf_runtime:
        motion_profile: ca
        noise_profile: package://gimbal_pipeline/config/norm4_v3/profiles/noise/ypd_ba_low_weight.yaml
        translation_model: CA
      slow_structure:
        alpha_dza_dual: 0.02
        alpha_dza_single: 0.0
        alpha_r1_dual: 0.05
        alpha_r1_single: 0.0
        alpha_r2_dual: 0.05
        alpha_r2_single: 0.0
        prior_pull_gain: 0.002
        prior_sigma_dza: 0.06
        prior_sigma_r: 0.06
        q_theta_dza: 5.0e-07
        q_theta_r1: 1.0e-06
        q_theta_r2: 1.0e-06
      warmup:
        min_confidence_to_commit: 0.7
        min_margin_to_commit: 1.5
    outpost:
      binding_enable_multi_obs: true
      lost_thres: 50
      max_match_distance: 2.0
      max_match_yaw_diff: 1.0
      singer_alpha: 0.01
      singer_sigma: 0.01
      spin_process_noise_theta_acc: 1.0
      spin_process_noise_theta_rate: 1.0
      temp_lost_thres: 20
      weight_z_history: 2.0
    panel_mismatch:
      threshold_t1: 9.0e-07
    predict_rate: 20.0
    selector:
      priority_robot_ids:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      - sentry
      - outpost
      - base
    smoother:
      enable_outlier_filter: false
      enable_position_smooth: true
      vel_beta: 0.01
      vel_min_cutoff: 0.1
    spin:
      spin_process_noise_delta_acc: 45.0
      spin_process_noise_delta_rate: 3.5
      spin_process_noise_yaw_acc: 18.0
      spin_process_noise_yaw_rate: 3.5
    tracker:
      degraded_single_obs_enable: true
      jump_binding_enable: true
      lost_thres: 4
      max_match_distance: 2.0
      max_match_yaw_diff: 1.0
    tracker_timeout: 5.5
    ukf:
      dual_obs_noise_pos: 0.01
      enable_ypd_observation_noise: false
      obs_noise_pos: 0.08
      obs_noise_yaw: 0.05
