# Multi-Camera Fusion Parameters

/**:
  ros__parameters:
    # 订阅的摄像头话题列表（根据实际情况修改）
    camera_topics:
      - "/camera1/armor_detector/armors"
      - "/camera2/armor_detector/armors"
    
    # 目标坐标系
    target_frame: "base_link"
    
    # DBSCAN 聚类参数
    # eps: 聚类半径（米）- 两个点被认为是邻居的最大距离
    dbscan_eps: 0.3
    # min_samples: 形成聚类的最小样本数
    dbscan_min_samples: 1
    
    # 最大聚类噪声距离（米）
    # 用于合并因噪声分开的同一目标的聚类
    max_cluster_noise: 0.5
    
    # 发布频率 (Hz)
    publish_rate: 100.0
    
    # 是否启用可视化
    enable_visualization: true
    
    # 测量缓冲区大小
    measurement_buffer_size: 10
    
    # 同步超时时间（秒）
    # 超过此时间的消息将被丢弃
    sync_timeout: 0.05
