gimbal_pipeline:
  ros__parameters:
    binder:
      confidence_floor: 0.15
      confirm_frames: 3
      cost_margin_min: 0.08
      dual_obs_enable: true
      dz_ema_alpha: 0.2
      dz_gate: 0.01
      dz_match_tolerance: 0.03
      force_rebind_bad_frames: 10
      lock_new_hold_frames: 2
      min_candidate_margin: 0.12
      min_candidate_prob: 0.4
      pending_window_frames: 0
      periodic_enable: false
      post_jump_min_confidence: 0.45
      reacquire_gap_dt_gate: 0.12
      reacquire_lost_frames_gate: 1
      same_panel_xy_gate: 0.18
      same_panel_yaw_gate: 0.35
      same_panel_z_gate: 0.08
      scorer_enable: true
      single_obs_history_window: 8
      soft_fusion_w_continuity: 0.15
      soft_fusion_w_dyn: 0.2
      soft_fusion_w_geo: 0.4
      soft_fusion_w_seq: 0.25
      switch_strong_score: 0.6
      yaw_err_gate: 0.35
      z_audit_rebind_enable: false
      z_cluster_assign_gate: 0.1
      z_cluster_ema_alpha: 0.25
      z_jump_min: 0.015
    constraints:
      max_dz: 1.0
      max_radius: 0.3
      min_dz: -1.0
      min_radius: 0.12
    controller:
      control_rate: 250.0
      delay:
        flight_time_iters: 2
        max_processing_delay_s: 0.5
      fire:
        decision_policy: axis_threshold
        probability:
          burst:
            min_hit_count: 1
          commit:
            cooldown_ms: 0.0
          evidence:
            epsilon: 0.001
          fallback_sigma_x: 0.02
          fallback_sigma_y: 0.02
          fallback_sigma_z: 0.03
          gate:
            integrator_base_probability: 0.45
            integrator_fall: 6.0
            integrator_rise: 8.0
            mode: lowpass
          normal_velocity_gate:
            enable: true
            require_front_face: true
            v_activate_min: 8.0
          normal_velocity_weight:
            w_min: 0.5
          sigma_point:
            alpha: 0.7
            beta: 2.0
            enable: true
            kappa: 0.0
            method: unscented
            rho: 0.0
            sigma_delay: 0.005
          softmax_beta: 20.0
          strict_covariance: false
          temperature:
            theta_hold_cold: 0.7
            theta_hold_hot: 0.55
            theta_on_cold: 0.9
            theta_on_hot: 0.75
        target_visibility_policy: facing_only
        visualization:
          ellipse_samples: 64
          enable: true
          image_debug:
            height: 540
            publish_rate_hz: 10.0
            show_sigma_ellipse: true
            show_text: true
            show_velocity_fan: true
            width: 960
          max_impact_points: 120
      mpc:
        diagnostics:
          active_tol: 1e-4
          high_cost_enable: false
          log_every: 50
          log_on_failure: true
          low_cost_always: true
          rank_tol_rel: 1e-9
        enable_delay_compensation: true
        fov_constraint:
          enable: false
        maneuver_adapt:
          enable: false
        normalization:
          enable: true
          min_samples: 10
          mode: rms
          rms_epsilon: 1e-6
          typical_control:
            pitch_acc: 1.0
            yaw_acc: 1.0
          typical_delta_control:
            pitch_acc: 1.0
            yaw_acc: 1.0
          typical_state:
            pitch: 1.0
            pitch_vel: 1.0
            yaw: 1.0
            yaw_vel: 1.0
          window_size: 80
        regularization:
          enable: true
          epsilon_abs: 1e-8
          epsilon_max: 1e-2
          epsilon_rel: 1e-6
          retry_on_fail: true
          retry_scale: 10.0
        vel_clamp:
          enable: true
        weighting:
          alpha: 3.0
          delay_s: 0.0
          gamma: 0.5
          k_omega: 0.5
          max_w: 6.0
          min_distance: 0.1
          sigma_beta: 0.3
          sigma_max: 0.5
          sigma_min: 0.05
          sigma_sys: 0.02
          smooth_alpha: 0.7
          target_size: 0.135
        yaw_feedforward_k_s: 0.0
      output_filter:
        enable_ema: false
        enable_moving_average: false
        enable_one_euro: false
        max_outlier_count: 3
        max_yaw_diff: 15.0
        max_yaw_rate: 5.0
        outlier_threshold_yaw: 8.0
      solver:
        gravity: 9.8
        iteration_times: 20
        min_switching_v_yaw: 0.0
        radial_dynamic:
          enable: false
        resistance: 0.001
        virtual_pose:
          auto_switch:
            fixed_id: 0
          fixed_id: 0
    default_r1: 0.15
    default_r2: 0.2
    enable_oscillation_detection: false
    entropy:
      k_prior_weight: 0.7
      temperature: 2.0
      use_adaptive: true
    external_targets:
      allowed_ids_by_mode:
        mode_2:
        - small_buff
        mode_3:
        - small_buff
        mode_4:
        - big_buff
        mode_5:
        - big_buff
      buff:
        timeout_s: 0.3
        topic: auto_buff/tracked_robot
    logging:
      flush_every_n: 50
      output_dir: /tmp/prediction_logs
      robot_id_filter: ''
    maneuver:
      enable: true
      innov_norm_threshold_dual: 0.0613
      innov_norm_threshold_single: 0.1279
      mad_filter_enable: false
      nis_threshold_dual: 4132.11
      nis_threshold_single: 238.807
    motion:
      process_noise_dz: 5.0e-05
      process_noise_r: 0.002
      translation_model: Singer
    norm4_v3:
      backend_config:
        motion_profile: package://gimbal_pipeline/config/norm4_v3/profiles/motion/default.yaml
        structure_profile: slow
      enable_2d_tracker: true
      enable_common_pipeline: false
      enable_kinematic_anti_pingpong: true
      enable_phase_memory: true
      enable_proxy_manager: true
      fallback:
        enable_ambiguous_single_fallback: true
        predict_only_on_reject: true
      hypothesis_selector:
        ambiguous_margin: 1.0
        commit_top1_only: true
        include_rejected_in_debug: true
        max_reconstruction_pos_error: 0.3
        min_top1_top2_margin: 0.0
        topk: 4
      inekf:
        dual_raw_R_scale: 1.5
        dual_raw_batch: true
        dual_update:
          structural_gain_dza: 0.02
          structural_gain_r: 0.05
        enabled: true
        force_rotation_ca: false
        gate:
          dual_each_pos_chi2: 16.0
          dual_each_yaw_chi2: 9.0
          dual_total_nis: 45.0
          single_pos_chi2: 16.0
          single_total_nis: 25.0
          single_yaw_chi2: 9.0
        posterior_sanity:
          max_center_jump: 0.25
          max_dza: 0.15
          max_dza_jump: 0.03
          max_r: 0.5
          max_r_jump: 0.05
          max_yaw_jump: 0.8
          min_dza: 0.0
          min_r: 0.05
        sigma_pos_xy: 0.06
        sigma_pos_z: 0.08
        sigma_yaw: 0.12
      inekf_runtime:
        ca_process_noise_acc: -1.0
        cv_process_noise_vel: -1.0
        process_noise_dz: -1.0
        process_noise_r: -1.0
        singer_alpha: -1.0
        singer_sigma: -1.0
        spin_process_noise_delta_acc: -1.0
        spin_process_noise_delta_rate: -1.0
        structure_profile: slow
      mode_routing:
        ambiguous_output: single_plate_3d
        ambiguous_structured_backend_mode: shallow_or_predict
        structured_output: structured_ukf
        structured_single_plate_mode: shallow
      phase_memory:
        anti_pingpong:
          jerk_gate: 1.5
          min_consistent_frames_to_commit: 3
          pending_timeout_frames: 12
          velocity_dir_cos_min: 0.2
          yaw_rate_jump_gate: 2.0
        enable_kinematic_anti_pingpong: true
        enable_opposite_jump_detect: true
        enable_phase_memory: true
        ping_pong_pattern_threshold: 0.7
        sequence_window_size: 10
      single_plate_bridge:
        enable: false
      slow_structure:
        enable: true
        max_dza: 0.12
        max_r: 0.5
        min_dza: 0.0
        min_r: 0.05
        prior_dza: 0.0
        prior_r1: 0.15
        prior_r2: 0.2
      ukf_v1:
        dual_raw_R_scale: 1.5
        dual_raw_batch: true
        dual_update:
          structural_gain_dza: 0.02
          structural_gain_r: 0.05
        enabled: true
        force_rotation_ca: false
        gate:
          dual_each_pos_chi2: 16.0
          dual_each_yaw_chi2: 9.0
          dual_total_nis: 45.0
          single_pos_chi2: 16.0
          single_total_nis: 25.0
          single_yaw_chi2: 9.0
        posterior_sanity:
          max_center_jump: 0.25
          max_dza: 0.15
          max_dza_jump: 0.03
          max_r: 0.5
          max_r_jump: 0.05
          max_yaw_jump: 0.8
          min_dza: 0.0
          min_r: 0.05
        sigma_pos_xy: 0.06
        sigma_pos_z: 0.08
        sigma_yaw: 0.12
        single_update:
          structural_gain_dza: 0.0
          structural_gain_r: 0.0
      warmup:
        enable_dual_seed_01: true
        min_settle_frames: 3
        warmup_frames: 8
    outpost:
      alpha_pos: 0.65
      alpha_yaw: 0.6
      ambiguous_backend_use_imm_adapter: false
      ambiguous_publish_single_armor_semantics: true
      ambiguous_single_armor_zero_offset: true
      assume_static_center: true
      beta_vel: 0.3
      beta_yaw_rate: 0.25
      binding_confidence_floor: 0.15
      binding_conflict_position_scale: 0.1
      binding_dz_ema_alpha: 0.2
      binding_min_candidate_margin: 0.12
      binding_min_candidate_prob: 0.4
      binding_period_min_spin_rate: 0.8
      binding_period_update_min_confidence: 0.55
      binding_period_update_min_jump: 0.015
      binding_period_weight: 0.6
      binding_period_window: 12
      binding_same_panel_xy_gate: 0.18
      binding_same_panel_yaw_gate: 0.35
      binding_same_panel_z_gate: 0.08
      binding_switch_strong_score: 0.6
      binding_topology_prior_weight: 4.0
      binding_transition_confirm_frames: 3
      binding_use_new_binder_pipeline: false
      entropy_enter: 0.75
      entropy_exit: 0.6
      linear_velocity_damping: 0.9
      max_center_speed: 1.0
      max_prob_enter: 0.6
      max_prob_exit: 0.75
      max_yaw_rate: 12.0
      max_yaw_rate_step: 3.0
      mode_enter_confirm_frames: 3
      mode_enter_threshold: 0.72
      mode_exit_confirm_frames: 4
      mode_exit_threshold: 0.45
      mode_min_dwell_frames: 6
      mode_weight_dual: 0.2
      mode_weight_entropy: 0.1
      mode_weight_health: 0.2
      mode_weight_jump: 0.3
      mode_weight_margin: 0.2
      panel_angle_step: 2.0943951023931953
      radius: 0.275
      rotation_model: CA
      single_mode_confidence_scale: 0.7
      softmax_temperature: 1.5
      spin_direction_confirm_frames: 3
      stable_frames: 4
      tracking_thres: 2
      translation_model: CA
      v2_warmup_enable: true
      v2_warmup_max_frames: 60
      v2_warmup_min_groups: 3
      v2_warmup_min_large_diff: 0.06
      v2_warmup_min_samples_per_group: 2
      v2_warmup_ratio_max: 2.45
      v2_warmup_ratio_min: 1.55
      v2_warmup_xyz_jump_gate: 0.18
      v2_warmup_yaw_jump_gate: 0.75
      v2_warmup_z_jump_gate: 0.025
      weight_switch_penalty: 0.05
      weight_xy_residual: 2.5
      weight_yaw: 1.0
      weight_z_state: 6.0
      yaw_rate_damping: 0.98
      z_audit_rebind_confirm_frames: 3
      z_audit_rebind_enable: true
      z_audit_rebind_min_confidence: 0.6
      z_audit_rebind_min_jump: 0.015
      z_history_window: 15
      z_offset_0: 0.102
      z_offset_1: 0.0
      z_offset_2: -0.102
    panel_mismatch:
      apply_correction: false
      confirm_count: 3
      enable: true
      reinit_count: 5
      window_size: 8
    robot_description:
      default_projection_mode: yaw_plane
      full_se3_ids:
      - big_buff
      - small_buff
      strict_unknown_reject: true
    selector:
      max_distance: 10.0
      max_yaw_deviation: 3.14159
      min_confidence: 0.15
      reference_yaw: 0.0
    smoother:
      default_freq: 30.0
      enable: true
      enable_structural_convergence: true
      enable_velocity_smooth: true
      enable_yaw_smooth: false
      outlier_iqr_k: 1.5
      outlier_mad_k: 3.5
      outlier_mahal_threshold: 9.21
      outlier_method: mad
      outlier_min_samples: 5
      outlier_window_size: 10
      pos_beta: 0.01
      pos_d_cutoff: 1.0
      pos_min_cutoff: 1.0
      rm_convergence_eps: 0.0001
      rm_dual_obs_boost: 3.0
      rm_gamma: 0.75
      rm_initial_step: 0.5
      rm_max_dz: 1.0
      rm_max_radius: 0.5
      rm_min_dz: -1.0
      rm_min_radius: 0.12
      rm_n0: 5
      vel_d_cutoff: 1.0
    source_frame: camera_optical_frame
    target_frame: odom
    tracker:
      debug_2d_viz:
        enable: true
        height: 540
        jpeg_quality: 70
        width: 960
      degraded_q_scale_dza: 4.0
      degraded_q_scale_r: 4.0
      degraded_single_obs_streak: 8
      jump_binding_confidence_floor: 0.15
      jump_binding_confirm_frames: 3
      jump_binding_cost_margin_min: 0.08
      jump_binding_dz_ema_alpha: 0.2
      jump_binding_dz_gate: 0.01
      jump_binding_dz_match_tolerance: 0.03
      jump_binding_switch_cooldown: 2
      jump_binding_yaw_err_gate: 0.35
      jump_binding_z_jump_min: 0.015
      n_panels: 4
      panel_angle_step: 1.5707963267948966
      periodic_binding_enable: false
      temp_lost_thres: 3
      tracking_thres: 2
    ukf:
      alpha: 0.001
      beta: 2.0
      dual_obs_geometry_noise_scale: 0.02
      dual_obs_noise_yaw: 0.03
      enable_innovation_gating: false
      innovation_gate_chi2_threshold: 9.49
      kappa: 0.0
      single_obs_update_weight_pos: 5.0
      ypd_sigma_azi: 0.01
      ypd_sigma_dist_coeff: 0.08
      ypd_sigma_ele: 0.01
    visualization_frame: odom
