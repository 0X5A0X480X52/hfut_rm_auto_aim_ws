/**:
  ros__parameters:
    # ==================== 调试模式 ====================
    debug: true
    
    # ==================== 异步更新参数 ====================
    predict_rate: 100.0          # 预测更新频率 (Hz)
    publish_rate: 100.0          # 发布频率 (Hz)
    detection_timeout: 0.5       # 检测超时时间 (s), 超过此时间使用纯预测
    
    # ==================== 数据关联参数 ====================
    max_match_distance: 0.5      # 最大匹配距离(米)
    max_match_yaw_diff: 1.0      # 最大匹配yaw角差(弧度)
    
    # ==================== 跟踪器状态机参数 ====================
    tracking_threshold: 3        # 进入TRACKING状态的最小匹配次数 (min_hits)
    lost_threshold: 30           # 进入LOST状态的最大丢失帧数 (max_age)
    
    # ==================== 跟踪器管理 ====================
    max_trackers: 20             # 最大跟踪器数量
    
    # ==================== 模型配置 ====================
    model:
      # 可选模型: CV_KF, CA_KF, CS_KF, Singer_KF, CTRV_EKF
      # 对于3D装甲板跟踪，推荐使用 CV_KF (匀速模型) 或 CA_KF (匀加速模型)
      name: "CV_KF"
      # 模型配置文件路径 (可选，留空使用默认配置)
      config_file: ""
    
    # ==================== 话题名称配置 ====================
    # 所有订阅和发布话题名都可以在这里配置
    topics:
      # 订阅话题
      armors_sub: "/armor_detector/armors"
      estimated_armors_sub: "/robot_pose_estimator/virtual_armors"
      # 发布话题
      tracked_armors_pub: "/armor_tracker/tracked_armors"
      markers_pub: "/armor_tracker/markers"
      history_windows_pub: "/armor_tracker/history_windows"
      prediction_windows_pub: "/armor_tracker/prediction_windows"
    
    # ==================== 历史窗口配置 ====================
    # 为每个跟踪对象维护历史状态窗口
    history_window:
      enable: true               # 是否启用历史窗口功能
      max_size: 100              # 窗口最大容量
      record_interval: 1         # 记录间隔 (每多少次迭代记录一次)
    
    # ==================== 预测窗口配置 ====================
    # 为每个跟踪对象生成未来状态预测
    prediction_window:
      enable: true               # 是否启用预测窗口功能
      steps: 30                  # 预测步数 (预测未来多少步)
      interval: 1                # 预测间隔 (每多少次迭代更新预测)
      dt: 0.01                   # 预测时间步长 (秒)
    
    # ==================== 策略参数 ====================
    strategy:
      # 检测来源策略
      detect:
        confidence_threshold: 0.5  # 置信度阈值
      
      # 估计来源策略
      estimate:
        weight_factor: 0.8         # 权重因子
      
      # 预测来源策略
      predict:
        max_predict_frames: 30     # 最大预测帧数
