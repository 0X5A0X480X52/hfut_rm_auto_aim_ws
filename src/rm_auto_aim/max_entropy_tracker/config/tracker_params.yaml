# Max Entropy Tracker 参数配置

max_entropy_tracker_node:
  ros__parameters:
    # 坐标系配置
    target_frame: "odom"                    # 目标坐标系（世界坐标系）
    source_frame: "camera_optical_frame"    # 源坐标系（相机坐标系）
    
    # 预测频率（Hz）- 定时器频率
    predict_rate: 100.0
    
    # 跟踪器默认参数
    default_r1: 0.15                        # 默认半径1（米）
    default_r2: 0.20                        # 默认半径2（米）
    default_dza: 0.0                        # 默认装甲板高度差（米）
    
    # 跟踪器超时时间（秒）
    tracker_timeout: 3.0
    
    # CSV 日志配置
    enable_csv_logging: true               # 是否启用 CSV 日志
    csv_log_path: "/tmp/max_entropy_tracker_log.csv"  # CSV 日志路径

    # 调试模式
    debug_mode: false

    # 震荡检测
    enable_oscillation_detection: false

    # UKF 参数（部分）
    ukf.alpha: 0.001
    ukf.beta: 2.0
    ukf.kappa: 0.0
    ukf.obs_noise_pos: 1.0
    ukf.obs_noise_yaw: 1.0
    ukf.dual_obs_noise_pos: 0.1
    ukf.dual_obs_noise_yaw: 0.3
    ukf.dual_obs_geometry_noise_scale: 0.5
    ukf.single_obs_update_weight_pos: 0.05
    ukf.enable_innovation_gating: false
    ukf.innovation_gate_chi2_threshold: 9.49

    # Motion model 参数
    motion.translation_model: "CA"
    motion.cv_process_noise_vel: 1.0
    motion.ca_process_noise_acc: 1.0
    motion.singer_alpha: 0.5
    motion.singer_sigma: 2.0
    motion.process_noise_r: 0.2
    motion.process_noise_dz: 0.05

    # Spin model 参数
    spin.spin_process_noise_yaw_rate: 0.3
    spin.spin_process_noise_yaw_acc: 1.0
    spin.spin_process_noise_delta_rate: 0.3
    spin.spin_process_noise_delta_acc: 3.0

    # Entropy 参数
    entropy.temperature: 2.0
    entropy.use_adaptive: true
    entropy.k_prior_weight: 0.7

    # Tracker 参数
    tracker.tracking_thres: 2
    tracker.lost_thres: 8
    tracker.temp_lost_thres: 3
    tracker.max_match_distance: 0.05
    tracker.max_match_yaw_diff: 0.05
    tracker.n_panels: 4
    tracker.panel_angle_step: 1.5707963267948966

    # Constraint 参数
    constraints.min_radius: 0.12
    constraints.max_radius: 0.5
    constraints.min_dz: -1.0
    constraints.max_dz: 1.0
