# Trajectory Planner Configuration
# MPC-based gimbal trajectory planner
trajectory_planner:
  ros__parameters:
    # ==================== 话题配置 ====================
    topics:
      # 订阅话题
      prediction_windows_sub: "/armor_tracker/prediction_windows"
      robots_sub: "/robot_pose_estimator/robots"
      joint_states_sub: "/joint_states"
      
      # 发布话题
      gimbal_cmd_pub: "/trajectory_planner/gimbal_cmd"
      trajectory_pub: "/trajectory_planner/trajectory"
      markers_pub: "/trajectory_planner/markers"
      
      # 弹道解算服务
      ballistic_service: "/ballistic_solver/solve"

    # ==================== 规划器配置 ====================
    # 控制频率 (Hz)
    control_rate: 100.0

    # 开火判断阈值
    fire_yaw_threshold: 0.05       # yaw误差阈值 (rad), 约3度
    fire_pitch_threshold: 0.05     # pitch误差阈值 (rad)
    fire_distance_min: 1.0         # 最小开火距离 (m)
    fire_distance_max: 8.0         # 最大开火距离 (m)
    fire_confidence_threshold: 0.5 # 开火置信度阈值

    # 目标丢失超时 (秒)
    target_lost_timeout: 0.5

    # 子弹速度 (m/s)
    bullet_speed: 28.0

    # 调试模式
    debug: false

    # ==================== 云台配置 ====================
    gimbal:
      # 时间步长 (秒)
      dt: 0.01
      
      # 最大角速度 (度/秒)
      omega_max_deg: 360.0
      
      # 角度范围 (度)
      theta_min_deg: -90.0
      theta_max_deg: 90.0

    # ==================== MPC配置 ====================
    mpc:
      # 预测时域步数
      prediction_horizon: 18
      
      # 跟踪误差权重
      q_theta: 100.0     # 角度误差权重
      q_omega: 10.0      # 角速度误差权重
      q_alpha: 1.0       # 角加速度误差权重
      
      # 控制输入权重
      r_control: 0.01
      
      # 控制变化率权重 (平滑性)
      s_smooth: 5.0

    # ==================== 目标预测器配置 ====================
    predictor:
      # 最小置信度
      min_confidence: 0.3
      
      # 最大有效距离 (米) x 10000 以保持精度
      max_distance: 10.0
      
      # 装甲板选择策略: nearest_yaw, nearest_distance, highest_confidence
      selection_strategy: "nearest_yaw"

    # ==================== 目标管理器配置 ====================
    manager:
      # 目标超时时间 (秒)
      target_timeout: 2.0
      
      # 机器人信息超时时间 (秒)
      robot_info_timeout: 1.0
