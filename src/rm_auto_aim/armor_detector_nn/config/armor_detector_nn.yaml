armor_detector:
  ros__parameters:
    debug: true
    target_frame: "odom"

    backend:
      type: "onnxruntime"
      device: "cuda"
      precision: "fp32"
      model_path: "package://armor_detector_nn/model/demo01/best.onnx"
      engine_path: ""
      openvino_model_xml: ""
      openvino_model_bin: ""
      calibration_cache: ""
      input_name: "images"
      output_names: ["output0"]
      warmup_iterations: 10
      num_threads: 2
      allow_fallback: false
      fallback_type: "onnxruntime"
      openvino_use_native_preprocess: false
      openvino_cache_dir: ""
      openvino_hybrid_affinity: false
      openvino_num_requests: 1
      openvino_device_config: ""

    preprocess:
      input_width: 640
      input_height: 640
      input_layout: "nchw"
      input_color: "rgb"
      resize_mode: "letterbox"
      normalize: true
      mean: [0.0, 0.0, 0.0]
      std: [255.0, 255.0, 255.0]
      pad_value: 114.0

    postprocess:
      strategy: "ultralytics_pose"
      output_layout: "channels_first"
      num_classes: 14
      num_keypoints: 4
      keypoint_dims: 2
      bbox_offset: 0
      class_offset: 4
      keypoint_offset: 18
      box_format: "cxcywh"
      conf_threshold: 0.45
      nms_threshold: 0.7
      max_detections: 32
      class_agnostic_nms: false
      keypoint_remap: [1, 0, 3, 2]
      head_already_applied: true
      keypoint_auto_reorder: false

    label_map:
      path: "package://armor_detector_nn/config/label_map.yaml"

    number_classifier:
      enabled: true
      model_path: "package://armor_detector/model/lenet.onnx"
      label_path: "package://armor_detector/model/label.txt"
      threshold: 0.7
      ignore_classes: ["negative"]

    pose:
      use_ba: true
      pnp_method: "ippe"
      small_armor_width: 0.133
      small_armor_height: 0.050
      large_armor_width: 0.225
      large_armor_height: 0.050

    runtime:
      color_filter_source: "model"
      publish_empty: true
      drop_frame_when_busy: true
      copy_policy: "copy_on_write_debug"
      scheduling_mode: "sync"
      frame_queue_size: 2
      batch_min_size: 1
      batch_max_size: 2
      batch_timeout_ms: 2.0
      max_observation_age_ms: 50.0
      publish_out_of_order: false
      profile: true
